<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        video {
            width: 80%;
            max-width: 800px;
            border: 2px solid #fff;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="info">
        <h3>Video Test Page</h3>
        <p>Video should autoplay, loop, and be muted</p>
        <p id="status">Loading...</p>
    </div>
    
    <video id="testVideo" autoplay loop muted playsinline controls>
        <source src="/assets/hero-video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        const video = document.getElementById('testVideo');
        const status = document.getElementById('status');
        
        video.addEventListener('loadeddata', () => {
            status.innerHTML = `
                ✅ Video loaded successfully!<br>
                Duration: ${video.duration.toFixed(2)}s<br>
                Dimensions: ${video.videoWidth}x${video.videoHeight}<br>
                Ready State: ${video.readyState}
            `;
        });
        
        video.addEventListener('error', (e) => {
            status.innerHTML = `❌ Error loading video: ${e.message}`;
        });
        
        video.play().catch(err => {
            status.innerHTML += `<br>⚠️ Autoplay blocked: ${err.message}`;
        });
    </script>
</body>
</html>
